<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌍 环境系统演示 - AI Game Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }
        
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        #ui-overlay {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            min-width: 280px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        h1 {
            font-size: 1.2rem;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .info-panel {
            margin-bottom: 20px;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .info-label {
            color: #aaa;
            font-size: 0.85rem;
        }
        
        .info-value {
            font-weight: 600;
            color: #4fd1c5;
        }
        
        .control-section {
            margin-top: 16px;
        }
        
        .control-section h3 {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .button-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        
        button {
            padding: 10px 12px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        
        button:hover {
            background: rgba(79, 209, 197, 0.3);
            transform: translateY(-2px);
        }
        
        button.active {
            background: #4fd1c5;
            color: #1a1a2e;
        }
        
        .preset-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        
        .preset-btn {
            padding: 6px 12px;
            font-size: 0.75rem;
        }
        
        .instructions {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.8rem;
            color: #aaa;
            z-index: 100;
        }
        
        .instructions kbd {
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="ui-overlay">
        <h1>🌍 环境系统演示</h1>
        
        <div class="info-panel">
            <div class="info-row">
                <span class="info-label">🕐 时间</span>
                <span class="info-value" id="time-display">12:00</span>
            </div>
            <div class="info-row">
                <span class="info-label">🌅 时段</span>
                <span class="info-value" id="phase-display">day</span>
            </div>
            <div class="info-row">
                <span class="info-label">🌤️ 天气</span>
                <span class="info-value" id="weather-display">clear</span>
            </div>
        </div>
        
        <div class="control-section">
            <h3>⏱️ 时间控制</h3>
            <div class="button-grid">
                <button onclick="setTime(6)">🌅 日出 6:00</button>
                <button onclick="setTime(12)">☀️ 正午 12:00</button>
                <button onclick="setTime(18)">🌇 日落 18:00</button>
                <button onclick="setTime(0)">🌙 午夜 0:00</button>
            </div>
        </div>
        
        <div class="control-section">
            <h3>🌤️ 天气控制</h3>
            <div class="button-grid">
                <button onclick="setWeather('clear')" class="active" id="btn-clear">☀️ 晴朗</button>
                <button onclick="setWeather('rain')" id="btn-rain">🌧️ 小雨</button>
                <button onclick="setWeather('storm')" id="btn-storm">⛈️ 雷暴</button>
                <button onclick="setWeather('snow')" id="btn-snow">❄️ 降雪</button>
                <button onclick="setWeather('fog')" id="btn-fog">🌫️ 雾</button>
            </div>
        </div>
        
        <div class="control-section">
            <h3>🎭 场景预设</h3>
            <div class="preset-buttons">
                <button class="preset-btn" onclick="applyPreset('sunrise')">日出</button>
                <button class="preset-btn" onclick="applyPreset('sunset')">日落</button>
                <button class="preset-btn" onclick="applyPreset('midnight')">午夜</button>
                <button class="preset-btn" onclick="applyPreset('rainyDay')">雨天</button>
                <button class="preset-btn" onclick="applyPreset('snowyNight')">雪夜</button>
                <button class="preset-btn" onclick="applyPreset('thunderStorm')">雷暴</button>
            </div>
        </div>
    </div>
    
    <div class="instructions">
        <kbd>WASD</kbd> 移动 | <kbd>鼠标</kbd> 视角 | <kbd>空格</kbd> 跳跃
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
    <script src="src/Environment/DayNightCycle.js"></script>
    <script src="src/Environment/WeatherSystem.js"></script>
    <script src="src/Environment/EnvironmentManager.js"></script>
    
    <script>
        // Three.js 场景设置
        let scene, camera, renderer, player;
        let envManager;
        let clock;
        
        // 玩家控制
        const keys = { w: false, a: false, s: false, d: false, space: false };
        const playerVelocity = new THREE.Vector3();
        
        function init() {
            // 场景
            scene = new THREE.Scene();
            
            // 相机
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);
            
            // 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            // 地面
            const groundGeo = new THREE.PlaneGeometry(100, 100);
            const groundMat = new THREE.MeshStandardMaterial({ 
                color: 0x228b22,
                roughness: 0.8
            });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
            
            // 网格辅助
            const grid = new THREE.GridHelper(100, 50, 0x444444, 0x222222);
            scene.add(grid);
            
            // 玩家
            const playerGeo = new THREE.BoxGeometry(1, 2, 1);
            const playerMat = new THREE.MeshStandardMaterial({ color: 0x4fd1c5 });
            player = new THREE.Mesh(playerGeo, playerMat);
            player.position.y = 1;
            player.castShadow = true;
            scene.add(player);
            
            // 环境管理器
            envManager = new EnvironmentManager({ scene });
            
            // 时钟
            clock = new THREE.Clock();
            
            // 事件监听
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            
            // 开始动画
            animate();
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function onKeyDown(e) {
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = true;
            if (e.code === 'Space') keys.space = true;
        }
        
        function onKeyUp(e) {
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = false;
            if (e.code === 'Space') keys.space = false;
        }
        
        function updatePlayer(delta) {
            const speed = 10 * delta;
            
            if (keys.w) player.position.z -= speed;
            if (keys.s) player.position.z += speed;
            if (keys.a) player.position.x -= speed;
            if (keys.d) player.position.x += speed;
            
            // 相机跟随
            camera.position.x = player.position.x;
            camera.position.z = player.position.z + 10;
            camera.lookAt(player.position);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            
            // 更新玩家
            updatePlayer(delta);
            
            // 更新环境系统
            if (envManager) {
                envManager.update(delta * 1000);
                
                // 更新UI
                document.getElementById('time-display').textContent = envManager.getTime();
                document.getElementById('phase-display').textContent = envManager.getPhase();
                document.getElementById('weather-display').textContent = envManager.getWeather();
            }
            
            renderer.render(scene, camera);
        }
        
        // 全局控制函数
        window.setTime = function(hour) {
            if (envManager) envManager.setTime(hour);
        };
        
        window.setWeather = function(weather) {
            if (envManager) envManager.setWeather(weather);
            
            // 更新按钮状态
            document.querySelectorAll('.button-grid button').forEach(btn => {
                btn.classList.remove('active');
            });
            const btn = document.getElementById('btn-' + weather);
            if (btn) btn.classList.add('active');
        };
        
        window.applyPreset = function(preset) {
            if (envManager) envManager.applyPreset(preset);
        };
        
        // 启动
        init();
    </script>
</body>
</html>
