<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>粒子系统演示 - AI Game Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }
        
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        #controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            width: 280px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        #controls h2 {
            font-size: 18px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        #controls h2::before {
            content: '✨';
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        .control-group label {
            display: block;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .effect-btn {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 8px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .effect-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }
        
        .effect-btn:active {
            transform: translateY(0);
        }
        
        .effect-btn.fire { background: linear-gradient(135deg, #ff6b35, #f7931e); color: white; }
        .effect-btn.smoke { background: linear-gradient(135deg, #666, #999); color: white; }
        .effect-btn.explosion { background: linear-gradient(135deg, #ff416c, #ff4b2b); color: white; }
        .effect-btn.sparks { background: linear-gradient(135deg, #f7971e, #ffd200); color: #333; }
        .effect-btn.magic { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .effect-btn.orb { background: linear-gradient(135deg, #00c6ff, #0072ff); color: white; }
        .effect-btn.rain { background: linear-gradient(135deg, #3a7bd5, #3a6073); color: white; }
        .effect-btn.snow { background: linear-gradient(135deg, #e6e9f0, #eef1f5); color: #333; }
        .effect-btn.shield { background: linear-gradient(135deg, #00d2ff, #3a7bd5); color: white; }
        .effect-btn.weapon { background: linear-gradient(135deg, #f5af19, #f12711); color: white; }
        .effect-btn.exp { background: linear-gradient(135deg, #11998e, #38ef7d); color: white; }
        .effect-btn.poison { background: linear-gradient(135deg, #56ab2f, #a8e063); color: #333; }
        .effect-btn.frost { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; }
        .effect-btn.coin { background: linear-gradient(135deg, #f7971e, #ffd700); color: #333; }
        .effect-btn.void { background: linear-gradient(135deg, #2c3e50, #4ca1af); color: white; }
        
        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
            margin: 15px 0;
        }
        
        .info {
            font-size: 11px;
            color: #888;
            text-align: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }
        
        #info-panel {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 15px 20px;
            font-size: 13px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        #info-panel .stat {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 5px;
        }
        
        #info-panel .stat:last-child {
            margin-bottom: 0;
        }
        
        #info-panel .stat-value {
            color: #4ecdc4;
            font-weight: 600;
        }
        
        .click-hint {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 12px 20px;
            font-size: 12px;
            color: #aaa;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="controls">
        <h2>粒子特效</h2>
        
        <div class="control-group">
            <label>环境效果</label>
            <button class="effect-btn rain" onclick="triggerEffect('rain')">🌧️ 雨</button>
            <button class="effect-btn snow" onclick="triggerEffect('snow')">❄️ 雪</button>
        </div>
        
        <div class="divider"></div>
        
        <div class="control-group">
            <label>战斗特效</label>
            <button class="effect-btn fire" onclick="triggerEffect('fire')">🔥 火焰</button>
            <button class="effect-btn explosion" onclick="triggerEffect('explosion')">💥 爆炸</button>
            <button class="effect-btn sparks" onclick="triggerEffect('sparks')">⚡ 火花</button>
            <button class="effect-btn weapon" onclick="triggerEffect('weapon')">⚔️ 武器火花</button>
        </div>
        
        <div class="divider"></div>
        
        <div class="control-group">
            <label>魔法特效</label>
            <button class="effect-btn magic" onclick="triggerEffect('magicAura')">✨ 魔法光环</button>
            <button class="effect-btn orb" onclick="triggerEffect('magicOrb')">🔮 魔法球</button>
            <button class="effect-btn shield" onclick="triggerEffect('shield')">🛡️ 能量护盾</button>
            <button class="effect-btn frost" onclick="triggerEffect('frost')">❅ 冰霜</button>
            <button class="effect-btn void" onclick="triggerEffect('void')">🕳️ 虚空</button>
        </div>
        
        <div class="divider"></div>
        
        <div class="control-group">
            <label>环境/持续</label>
            <button class="effect-btn smoke" onclick="triggerEffect('smoke')">💨 烟雾</button>
            <button class="effect-btn poison" onclick="triggerEffect('poison')">☠️ 毒雾</button>
        </div>
        
        <div class="divider"></div>
        
        <div class="control-group">
            <label>收集特效</label>
            <button class="effect-btn exp" onclick="triggerEffect('exp')">⭐ 经验球</button>
            <button class="effect-btn coin" onclick="triggerEffect('coin')">💰 金币收集</button>
        </div>
        
        <div class="info">
            点击场景生成随机特效<br>
            拖拽旋转视角
        </div>
    </div>
    
    <div id="info-panel">
        <div class="stat">
            <span>FPS:</span>
            <span class="stat-value" id="fps">60</span>
        </div>
        <div class="stat">
            <span>活跃粒子:</span>
            <span class="stat-value" id="particles">0</span>
        </div>
        <div class="stat">
            <span>特效数量:</span>
            <span class="stat-value" id="effects">0</span>
        </div>
    </div>
    
    <div class="click-hint">
        🖱️ 点击任意位置触发随机特效
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { ParticleEmitter, ParticleSystem, ParticleFactory } from '../src/Particle/index.js';
        
        // 全局变量
        let scene, camera, renderer, controls;
        let particleSystem, particleFactory;
        let clock;
        let activeEffects = new Map();
        let frameCount = 0;
        let lastFpsUpdate = 0;
        
        // 初始化
        init();
        animate();
        
        function init() {
            // 场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);
            
            // 相机
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 15);
            
            // 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            // 控制器
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 5;
            controls.maxDistance = 50;
            
            // 粒子系统
            particleSystem = new ParticleSystem();
            particleSystem.setScene(scene);
            particleFactory = new ParticleFactory(particleSystem);
            
            // 时钟
            clock = new THREE.Clock();
            
            // 灯光
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(5, 10, 5);
            scene.add(directionalLight);
            
            // 地面网格
            const gridHelper = new THREE.GridHelper(30, 30, 0x444444, 0x333333);
            scene.add(gridHelper);
            
            // 中央火堆
            createCampfire();
            
            // 事件监听
            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('click', onCanvasClick);
            
            // 暴露全局函数
            window.triggerEffect = triggerEffect;
        }
        
        function createCampfire() {
            // 火堆底座
            const baseGeometry = new THREE.CylinderGeometry(1, 1.2, 0.3, 8);
            const baseMaterial = new THREE.MeshStandardMaterial({ color: 0x4a4a4a });
            const base = new THREE.Mesh(baseGeometry, baseMaterial);
            base.position.y = 0.15;
            scene.add(base);
            
            // 木头
            const woodGeometry = new THREE.CylinderGeometry(0.08, 0.08, 1.5, 6);
            const woodMaterial = new THREE.MeshStandardMaterial({ color: 0x5c4033 });
            
            for (let i = 0; i < 4; i++) {
                const wood = new THREE.Mesh(woodGeometry, woodMaterial);
                wood.rotation.z = Math.PI / 2;
                wood.rotation.y = (i / 4) * Math.PI;
                wood.position.y = 0.3;
                const offset = 0.3;
                wood.position.x = Math.cos((i / 4) * Math.PI) * offset;
                wood.position.z = Math.sin((i / 4) * Math.PI) * offset;
                scene.add(wood);
            }
            
            // 火焰特效
            const fire = particleFactory.createFire({ x: 0, y: 0.5, z: 0 });
            fire.options.emissionRate = 80;
            fire.options.maxParticles = 300;
            particleSystem.add('campfire', fire);
            
            // 烟雾特效
            const smoke = particleFactory.createSmoke({ x: 0, y: 1.5, z: 0 });
            smoke.options.emissionRate = 15;
            smoke.options.maxParticles = 80;
            particleSystem.add('campfire-smoke', smoke);
        }
        
        function triggerEffect(type) {
            const position = {
                x: (Math.random() - 0.5) * 10,
                y: Math.random() * 3 + 0.5,
                z: (Math.random() - 0.5) * 10
            };
            
            const effectNames = {
                'fire': () => particleFactory.createFire(position),
                'smoke': () => particleFactory.createSmoke(position),
                'explosion': () => particleFactory.createExplosion(position),
                'sparks': () => particleFactory.createSparks(position),
                'magicAura': () => particleFactory.createMagicAura(position),
                'magicOrb': () => particleFactory.createMagicOrb(position),
                'rain': () => particleFactory.createRain({ x: 20, y: 15, z: 20 }, position),
                'snow': () => particleFactory.createSnow({ x: 20, y: 15, z: 20 }, position),
                'shield': () => particleFactory.createEnergyShield(position),
                'weapon': () => particleFactory.createWeaponSparks(position),
                'exp': () => particleFactory.createExpOrb(position),
                'poison': () => particleFactory.createPoisonCloud(position),
                'frost': () => particleFactory.createFrost(position),
                'coin': () => particleFactory.createCoinCollect(position),
                'void': () => particleFactory.createVoid(position)
            };
            
            const creator = effectNames[type];
            if (creator) {
                const name = `effect_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
                const emitter = creator();
                
                // 自动清理临时特效
                const isTemporary = ['explosion', 'sparks', 'weapon', 'coin', 'exp'].includes(type);
                
                particleSystem.add(name, emitter);
                activeEffects.set(name, { emitter, type, isTemporary, createTime: Date.now() });
                
                // 更新计数
                document.getElementById('effects').textContent = activeEffects.size;
                
                // 清理临时特效
                if (isTemporary) {
                    setTimeout(() => {
                        particleSystem.remove(name);
                        activeEffects.delete(name);
                        document.getElementById('effects').textContent = activeEffects.size;
                    }, 5000);
                }
            }
        }
        
        function onCanvasClick(event) {
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            
            const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            const intersection = new THREE.Vector3();
            raycaster.ray.intersectPlane(plane, intersection);
            
            if (intersection) {
                const types = ['fire', 'smoke', 'explosion', 'sparks', 'magicAura', 
                              'magicOrb', 'shield', 'frost', 'poison', 'exp', 'coin'];
                const randomType = types[Math.floor(Math.random() * types.length)];
                
                const position = { x: intersection.x, y: intersection.y + 0.5, z: intersection.z };
                const name = `click_${Date.now()}`;
                
                const creators = {
                    'fire': () => particleFactory.createFire(position),
                    'smoke': () => particleFactory.createSmoke(position),
                    'explosion': () => particleFactory.createExplosion(position),
                    'sparks': () => particleFactory.createSparks(position),
                    'magicAura': () => particleFactory.createMagicAura(position),
                    'magicOrb': () => particleFactory.createMagicOrb(position),
                    'shield': () => particleFactory.createEnergyShield(position),
                    'frost': () => particleFactory.createFrost(position),
                    'poison': () => particleFactory.createPoisonCloud(position),
                    'exp': () => particleFactory.createExpOrb(position),
                    'coin': () => particleFactory.createCoinCollect(position)
                };
                
                const emitter = creators[randomType]();
                particleSystem.add(name, emitter);
                activeEffects.set(name, { emitter, type: randomType, isTemporary: true, createTime: Date.now() });
                
                document.getElementById('effects').textContent = activeEffects.size;
                
                setTimeout(() => {
                    particleSystem.remove(name);
                    activeEffects.delete(name);
                    document.getElementById('effects').textContent = activeEffects.size;
                }, 4000);
            }
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            const deltaTime = clock.getDelta();
            
            // 更新粒子系统
            particleSystem.update(deltaTime);
            
            // 更新控制器
            controls.update();
            
            // 更新FPS
            frameCount++;
            const now = performance.now();
            if (now - lastFpsUpdate >= 1000) {
                document.getElementById('fps').textContent = frameCount;
                frameCount = 0;
                lastFpsUpdate = now;
            }
            
            // 更新粒子计数
            let totalParticles = 0;
            activeEffects.forEach(({ emitter }) => {
                totalParticles += emitter.particles.filter(p => p.alive).length;
            });
            // 中央火堆也计算在内
            totalParticles += particleSystem.get('campfire')?.particles.filter(p => p.alive).length || 0;
            totalParticles += particleSystem.get('campfire-smoke')?.particles.filter(p => p.alive).length || 0;
            
            document.getElementById('particles').textContent = totalParticles;
            
            // 渲染
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
